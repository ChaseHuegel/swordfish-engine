# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test Reef
      run: dotnet test Reef.Tests --no-build --verbosity normal
    - name: Test Reef rich text
      run: dotnet test Reef.Text.Tests --no-build --verbosity normal
    - name: Test Reef markup generator
      run: dotnet test Reef.Generator.Tests --no-build --verbosity normal
    - name: Test Reef markup runtime
      run: dotnet test Reef.Markup.Tests --no-build --verbosity normal
    - name: Publish
      run: dotnet publish -c Release -o ".output"
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Build artifact
        path: /home/runner/work/swordfish-engine/swordfish-engine/.output
