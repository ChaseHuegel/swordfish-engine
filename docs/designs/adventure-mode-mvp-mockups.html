<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wayward Beyond — Adventure Mode MVP UI Mockups (Rev 2)</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* =====================================================================
       Wayward Beyond Reef Theme Tokens (scoped to .wb-stage, never :root)
       Exact hex tokens from WaywardBeyond.Client/UI/Theme/Theme.rss
       ===================================================================== */
    .wb-stage {
      --wb-font-ui: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Mono", Consolas, monospace;

      --wb-text: #f0f3f6;
      --wb-text-muted: #8da0b8;
      --wb-text-dim: #45546b;
      --wb-text-soft: #bfbfbf;
      --wb-text-faint: #8da0b880;

      --wb-panel: #111723f0;
      --wb-panel-solid: #111723;
      --wb-panel-inner: #0d121cf0;
      --wb-border: #2b384e;
      --wb-border-inner: #1a2333;
      --wb-border-hover: #495d7a;

      --wb-accent: #4be3e3;
      --wb-accent-bright: #a5f3fc;
      --wb-accent-dark: #162838;
      --wb-primary: #f2994a;
      --wb-primary-bright: #ffd27d;
      --wb-primary-dark: #3d2614;
      --wb-danger: #e04f7a;
      --wb-danger-bright: #ff8da6;
      --wb-danger-dark: #3d141e;
      --wb-success: #6fcf97;
      --wb-warning: #f2cc4a;

      --wb-input: #1c2433;
      --wb-input-focus: #232e42;
      --wb-control: #151d2a;
      --wb-selected-surface: #172336;
      --wb-slot-size: 48px;
      --wb-selection: #0074ff80;
      --wb-button: #121826;
      --wb-button-hover: #1b2538;
      --wb-scrim: #000000bf;
      --wb-scrim-soft: #00000080;
      --wb-scrim-heavy: #000000f2;

      font-family: var(--wb-font-ui);
      color: var(--wb-text);
      image-rendering: pixelated;
      user-select: none;
    }

    /* Reef DrawCornerCaps(length, thickness, color) */
    .wb-caps-10 { position: relative; }
    .wb-caps-10::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      --cap-c: var(--wb-border);
      background:
        linear-gradient(var(--cap-c), var(--cap-c)) 0 0 / 10px 2px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 0 / 2px 10px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 0 / 10px 2px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 0 / 2px 10px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 100% / 10px 2px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 100% / 2px 10px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 100% / 10px 2px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 100% / 2px 10px no-repeat;
    }
    .wb-caps-10.wb-caps-hover::after { --cap-c: var(--wb-border-hover); }
    .wb-caps-10.wb-caps-danger::after { --cap-c: var(--wb-danger); }

    .wb-caps-6 { position: relative; }
    .wb-caps-6::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      --cap-c: var(--wb-border-hover);
      background:
        linear-gradient(var(--cap-c), var(--cap-c)) 0 0 / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 0 / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 0 / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 0 / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 100% / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 100% / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 100% / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 100% / 1px 6px no-repeat;
    }

    /* Panel & Dividers */
    .wb-panel { background: var(--wb-panel); padding: 2px; }
    .wb-panel-inner {
      border: 1px solid var(--wb-border-inner);
      padding: 14px;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .wb-panel-header {
      color: var(--wb-text-muted);
      font-size: 14px;
      text-align: center;
      line-height: 18px;
      letter-spacing: 0.02em;
    }
    .wb-divider { background: var(--wb-border); height: 1px; width: 100%; flex-shrink: 0; }
    .wb-divider-inner { background: var(--wb-border-inner); height: 1px; width: 100%; flex-shrink: 0; }
    .wb-divider-dashed {
      height: 1px;
      width: 100%;
      background-image: repeating-linear-gradient(to right, var(--wb-border) 0 2px, transparent 2px 6px);
      flex-shrink: 0;
    }
    .wb-info-box {
      background: var(--wb-panel-inner);
      border: 1px solid var(--wb-border);
      padding: 10px;
    }

    /* Buttons (Components.rss) */
    .wb-btn {
      position: relative;
      background: var(--wb-button);
      border: 1px solid var(--wb-border);
      color: var(--wb-text);
      padding: 2px;
      cursor: pointer;
      display: inline-flex;
      align-items: stretch;
      justify-content: center;
      transition: background 80ms, border-color 80ms, color 80ms;
      font-family: var(--wb-font-ui);
    }
    .wb-btn-inner {
      border: 1px solid var(--wb-border-inner);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 14px;
      font-size: 14px;
      gap: 6px;
    }
    .wb-btn-compact .wb-btn-inner { padding: 3px 10px; font-size: 12px; }
    .wb-btn:hover:not(:disabled) {
      background: var(--wb-button-hover);
      border-color: var(--wb-border-hover);
      color: var(--wb-text);
    }
    .wb-btn:active:not(:disabled) { background: var(--wb-accent-dark); }
    .wb-btn-primary { border-color: var(--wb-primary); color: var(--wb-accent-bright); }
    .wb-btn-primary .wb-btn-inner { border-color: var(--wb-primary-dark); }
    .wb-btn-primary::after { --cap-c: var(--wb-primary); }
    .wb-btn-primary:hover:not(:disabled) {
      background: var(--wb-button-hover);
      border-color: var(--wb-primary-bright);
      color: var(--wb-text);
    }
    .wb-btn-primary:hover:not(:disabled)::after { --cap-c: var(--wb-primary-bright); }
    .wb-btn-primary:active:not(:disabled) { background: var(--wb-primary-dark); }

    .wb-btn-danger { border-color: var(--wb-danger); color: var(--wb-danger-bright); }
    .wb-btn-danger .wb-btn-inner { border-color: var(--wb-danger-dark); }
    .wb-btn-danger::after { --cap-c: var(--wb-danger); }
    .wb-btn-danger:hover:not(:disabled) {
      background: var(--wb-button-hover);
      border-color: var(--wb-danger-bright);
      color: var(--wb-text);
    }
    .wb-btn-danger:hover:not(:disabled)::after { --cap-c: var(--wb-danger-bright); }

    .wb-btn:disabled {
      background: var(--wb-panel-inner);
      border-color: var(--wb-border-inner);
      color: var(--wb-text-dim);
      cursor: not-allowed;
    }
    .wb-btn:disabled::after { display: none; }
    .wb-btn:disabled .wb-btn-inner { border-color: transparent; }

    /* IconButton (Components.rss) */
    .wb-icon-btn {
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--wb-text-muted);
      background: transparent;
      border: 0;
      cursor: pointer;
      transition: background 80ms, color 80ms;
    }
    .wb-icon-btn:hover { background: var(--wb-button-hover); color: var(--wb-text); }
    .wb-icon-btn-danger { color: var(--wb-danger); }
    .wb-icon-btn-danger:hover { background: var(--wb-danger-dark); color: var(--wb-danger-bright); }

    /* Attached Tabs (Components.rss) */
    .wb-tab {
      position: relative;
      background: var(--wb-panel-inner);
      border: 1px solid var(--wb-border);
      color: var(--wb-text-muted);
      font-size: 13px;
      padding: 7px 18px;
      cursor: pointer;
      transition: color 80ms, border-color 80ms;
    }
    .wb-tab:hover { color: var(--wb-text); }
    .wb-tab-selected {
      background: var(--wb-panel-solid);
      border-color: var(--wb-accent);
      border-bottom-color: var(--wb-panel-solid);
      color: var(--wb-accent-bright);
      z-index: 2;
    }

    /* Card */
    .wb-card {
      position: relative;
      background: var(--wb-panel-inner);
      border: 1px solid var(--wb-border);
      color: var(--wb-text);
      padding: 7px 10px;
      transition: background 80ms, border-color 80ms;
    }
    .wb-card:hover {
      background: var(--wb-button-hover);
      border-color: var(--wb-border-hover);
    }

    /* ItemSlot (Components.rss: 48x48) */
    .wb-slot {
      position: relative;
      width: 48px;
      height: 48px;
      background: var(--wb-control);
      border: 1px solid var(--wb-border);
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 100ms, border-color 80ms, background 80ms;
    }
    .wb-slot:hover {
      background: var(--wb-button-hover);
      border-color: var(--wb-accent);
    }
    .wb-slot:hover::after {
      content: "";
      position: absolute;
      inset: -1px;
      pointer-events: none;
      --cap-c: var(--wb-accent-bright);
      background:
        linear-gradient(var(--cap-c), var(--cap-c)) 0 0 / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 0 / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 0 / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 0 / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 100% / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 100% / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 100% / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 100% / 1px 6px no-repeat;
    }
    .wb-slot-selected {
      background: var(--wb-selection) !important;
      border-color: var(--wb-primary) !important;
    }
    .wb-slot-selected::after {
      content: "";
      position: absolute;
      inset: -1px;
      pointer-events: none;
      --cap-c: var(--wb-primary-bright);
      background:
        linear-gradient(var(--cap-c), var(--cap-c)) 0 0 / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 0 / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 0 / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 0 / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 100% / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 100% / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 100% / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 100% / 1px 6px no-repeat;
    }
    .wb-slot-equipped {
      background: var(--wb-selected-surface);
      border-color: var(--wb-primary);
    }
    .wb-slot-valid-in {
      border-color: var(--wb-accent);
      box-shadow: inset 0 0 0 1px rgba(75, 227, 227, 0.25);
    }
    .wb-slot-dimmed { opacity: 0.34; }
    .wb-slot-number {
      position: absolute;
      top: 1px;
      left: 3px;
      font-size: 11px;
      line-height: 12px;
      color: var(--wb-text-dim);
      pointer-events: none;
    }
    .wb-slot-selected .wb-slot-number { color: var(--wb-primary-bright); }
    .wb-slot:hover .wb-slot-number { color: var(--wb-accent-bright); }
    .wb-slot-count {
      position: absolute;
      bottom: 1px;
      right: 1px;
      background: var(--wb-scrim-soft);
      color: var(--wb-text);
      font-size: 11px;
      line-height: 13px;
      padding: 0 3px;
      pointer-events: none;
    }
    .wb-slot-tier-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 5px;
      height: 5px;
      pointer-events: none;
    }

    /* Hotbar & Flush Left-Edge State Grid */
    .wb-hotbar {
      background: var(--wb-panel);
      border: 1px solid var(--wb-border);
      padding: 8px;
      display: flex;
      gap: 6px;
      height: 66px;
      align-items: center;
    }
    .wb-state-cell {
      width: 30px;
      height: 30px;
      background: var(--wb-panel);
      border: 1px solid var(--wb-border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 120ms, background 120ms, opacity 120ms;
    }

    /* SegmentedControl */
    .wb-choice {
      background: var(--wb-control);
      border: 1px solid var(--wb-border);
      padding: 1px;
      display: grid;
      gap: 1px;
    }
    .wb-choice-cell {
      background: var(--wb-control);
      color: var(--wb-text-muted);
      font-size: 14px;
      padding: 5px 10px;
      text-align: center;
      cursor: pointer;
    }
    .wb-choice-cell:hover:not(.wb-choice-selected) { background: var(--wb-button-hover); color: var(--wb-text); }
    .wb-choice-selected { background: var(--wb-accent-dark); color: var(--wb-accent-bright); }

    /* Input */
    .wb-input {
      background: var(--wb-input);
      border: 1px solid var(--wb-border);
      color: var(--wb-text);
      font-family: var(--wb-font-ui);
      font-size: 14px;
      padding: 4px 10px;
      outline: none;
    }
    .wb-input:focus { background: var(--wb-input-focus); border-color: var(--wb-border-hover); }
    .wb-input::placeholder { color: var(--wb-text-dim); }

    /* Keycap & HintPill */
    .wb-keycap {
      background: var(--wb-accent-dark);
      color: var(--wb-accent-bright);
      border: 1px solid var(--wb-border-hover);
      font-size: 12px;
      padding: 1px 6px;
      line-height: 16px;
    }
    .wb-hint-pill {
      background: var(--wb-panel);
      border: 1px solid var(--wb-border);
      padding: 3px 8px 3px 4px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--wb-text);
    }

    /* ProgressBar */
    .wb-progress-track {
      position: relative;
      background: var(--wb-control);
      border: 1px solid var(--wb-border);
      height: 8px;
      width: 100%;
      overflow: hidden;
    }
    .wb-progress-fill {
      height: 100%;
      background: var(--wb-accent);
      transition: width 100ms linear;
    }

    /* Scrollbar */
    .wb-scroll::-webkit-scrollbar { width: 6px; }
    .wb-scroll::-webkit-scrollbar-track { background: var(--wb-input); }
    .wb-scroll::-webkit-scrollbar-thumb { background: var(--wb-border-hover); }

    /* Critical Threshold Animations */
    @keyframes wbPulseDanger {
      0%, 100% { filter: drop-shadow(0 0 0px transparent); opacity: 1; }
      50% { filter: drop-shadow(0 0 6px #e04f7a); opacity: 0.58; }
    }
    @keyframes wbPulseWarn {
      0%, 100% { filter: drop-shadow(0 0 0px transparent); opacity: 1; }
      50% { filter: drop-shadow(0 0 5px #f2cc4a); opacity: 0.72; }
    }
    @keyframes wbFadeLow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .wb-pulse-danger { animation: wbPulseDanger 0.9s ease-in-out infinite; }
    .wb-pulse-warning { animation: wbPulseWarn 1.2s ease-in-out infinite; }
    .wb-buff-expiring { animation: wbFadeLow 1s ease-in-out infinite; }
    .wb-pip-shadow { filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.85)); }

    /* S.P.A.C.E.R. Single-Row Acronym Bar (100% Reef-native) */
    .wb-spacer-cell {
      background: var(--wb-panel-inner);
      border-top: 2px solid transparent;
      transition: background 80ms, border-color 80ms;
    }
    .wb-spacer-cell:hover {
      background: var(--wb-selected-surface);
      border-top-color: var(--wb-primary);
    }

    /* Retro Cassette-Futurism CRT Terminal (100% Reef OpenGL-feasible:
       flat fills, per-side bevel borders, corner-caps, border-dash, + 2 simple overlay textures) */
    .wb-crt-chassis {
      background: #1b2230;
      border-top: 2px solid #3a4466;
      border-left: 2px solid #3a4466;
      border-bottom: 2px solid #0b0e14;
      border-right: 2px solid #0b0e14;
    }
    .wb-crt-bezel-inner {
      border: 1px solid #262f42;
    }
    .wb-crt-well {
      background: #0b0e14;
      border-top: 2px solid #05070b;
      border-left: 2px solid #05070b;
      border-bottom: 2px solid #2b384e;
      border-right: 2px solid #2b384e;
      padding: 4px;
    }
    .wb-crt-screen {
      position: relative;
      overflow: hidden;
      background: var(--crt-bg);
      color: var(--crt-fg);
      border: 1px solid var(--crt-dim);
    }
    /* Optional Texture 1: crt_scanlines.png (tileable 1x3 alpha PNG overlay, passthrough="true") */
    .wb-crt-tex-scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.22) 0px,
        rgba(0, 0, 0, 0.22) 1px,
        transparent 1px,
        transparent 3px
      );
    }
    /* Optional Texture 2: crt_vignette.png (64x64 stretched alpha PNG corner-mask overlay, passthrough="true") */
    .wb-crt-tex-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 21;
      background: radial-gradient(ellipse at 50% 48%, transparent 62%, rgba(0, 0, 0, 0.48) 100%);
    }
    .wb-crt-btn {
      background: var(--crt-bg);
      border: 1px solid var(--crt-dim);
      color: var(--crt-fg);
      padding: 1px 6px;
      font-family: var(--wb-font-ui);
      font-size: 11px;
      cursor: pointer;
    }
    .wb-crt-btn:hover {
      background: var(--crt-fg);
      color: var(--crt-bg);
      border-color: var(--crt-bright);
    }
    .wb-crt-btn-danger {
      border-color: #e04f7a;
      color: #ff8da6;
    }
    .wb-crt-btn-danger:hover {
      background: #e04f7a;
      color: #0b0e14;
      border-color: #ff8da6;
    }
    .wb-crt-input {
      background: var(--crt-bg);
      border: none;
      border-bottom: 1px dashed var(--crt-dim);
      color: var(--crt-bright);
      font-family: var(--wb-font-ui);
      font-size: 12px;
      outline: none;
      padding: 1px 4px;
    }
    .wb-crt-input:focus { border-bottom-color: var(--crt-bright); }
    .wb-crt-input::placeholder { color: var(--crt-dim); }
    /* Physical beveled Reef keycap button */
    .wb-crt-key {
      background: #1c2433;
      border-top: 1px solid #495d7a;
      border-left: 1px solid #495d7a;
      border-bottom: 2px solid #0b0e14;
      border-right: 2px solid #0b0e14;
      color: #c0cbdc;
      font-family: var(--wb-font-ui);
      font-size: 11px;
      padding: 3px 10px;
      cursor: pointer;
    }
    .wb-crt-key:hover { background: #232e42; color: #f0f3f6; }
    .wb-crt-key:active {
      border-top: 2px solid #0b0e14;
      border-left: 2px solid #0b0e14;
      border-bottom: 1px solid #495d7a;
      border-right: 1px solid #495d7a;
    }

    /* Global Reef Tooltip (ItemTooltip.rml) */
    #wb-tooltip {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      display: none;
      background: #111723f5;
      border: 1px solid #2b384e;
      padding: 2px;
      min-width: 176px;
      max-width: 268px;
      font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Consolas, monospace;
    }
    #wb-tooltip::after {
      content: "";
      position: absolute;
      inset: -1px;
      pointer-events: none;
      --cap-c: #495d7a;
      background:
        linear-gradient(var(--cap-c), var(--cap-c)) 0 0 / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 0 / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 0 / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 0 / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 100% / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 0 100% / 1px 6px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 100% / 6px 1px no-repeat,
        linear-gradient(var(--cap-c), var(--cap-c)) 100% 100% / 1px 6px no-repeat;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased m-0 p-0 min-h-screen flex flex-col">

  <!-- Workbench Header (Host-Themed Chrome) -->
  <header class="bg-[var(--card)] border-b border-[var(--border)] px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-2.5">
      <div class="w-2.5 h-2.5 bg-[#4be3e3] border border-[#a5f3fc]"></div>
      <div>
        <h1 class="text-sm font-semibold tracking-tight text-[var(--foreground)] leading-tight">
          Wayward Beyond — Adventure Mode MVP UI <span class="text-xs font-normal text-[var(--muted-foreground)]">(Rev 2 · Post-Review)</span>
        </h1>

  /* =========================================================================
     HELPERS
     ========================================================================= */
  function countItem(id) {
    let total = 0;
    for (const s of state.inventory) if (s && s.id === id) total += s.count;
    for (const s of state.hotbar) if (s && s.id === id) total += s.count;
    return total;
  }

  function consumeItem(id, qty) {
    let rem = qty;
    for (const list of [state.inventory, state.hotbar]) {
      for (let i = 0; i < list.length && rem > 0; i++) {
        if (list[i] && list[i].id === id) {
          const take = Math.min(rem, list[i].count);
          list[i].count -= take;
          rem -= take;
          if (list[i].count <= 0) list[i] = null;
        }
      }
    }
    return rem === 0;
  }

  function addItem(id, qty) {
    const def = ITEMS[id];
    if (!def) return;
    let rem = qty;
    for (const list of [state.inventory, state.hotbar]) {
      for (let i = 0; i < list.length && rem > 0; i++) {
        if (list[i] && list[i].id === id && list[i].count < def.maxStack) {
          const add = Math.min(rem, def.maxStack - list[i].count);
          list[i].count += add;
          rem -= add;
        }
      }
    }
    for (const list of [state.inventory, state.hotbar]) {
      for (let i = 0; i < list.length && rem > 0; i++) {
        if (!list[i]) {
          const add = Math.min(rem, def.maxStack);
          list[i] = { id, count: add };
          rem -= add;
        }
      }
    }
  }

  function isValidAutoInput(machineKey, itemId) {
    const m = AUTO_MACHINES[machineKey];
    if (m.dualRule) return itemId === m.dualRule.a || m.dualRule.b.includes(itemId);
    return Boolean(m.rules && m.rules[itemId]);
  }

  function canCraft(recipe) {
    return recipe.reqs.every(req => countItem(req.id) >= req.qty);
  }

  function grantSkillXp(skillId, amount) {
    const sk = state.skills.find(s => s.id === skillId);
    if (!sk) return;
    sk.xp += amount;
    sk.totalXp += amount;
    state.activeSkillIdx = state.skills.indexOf(sk);
    state.lastXpGain = amount;
    state.showSkillBar = true;
    while (sk.xp >= sk.xpNext && sk.rank < 100) {
      sk.xp -= sk.xpNext;
      sk.rank += 1;
      const ms = sk.milestones.find(m => m.r === sk.rank);
      pushToast(
        ms ? `${sk.name} Lvl ${sk.rank} milestone` : `${sk.name} Lvl ${sk.rank}`,
        ms ? ms.text : '',
        ms ? 'primary' : 'accent'
      );
    }
  }

  function pushToast(title, sub, tone = 'accent') {
    const box = document.getElementById('toast-layer');
    const borderC = tone === 'primary' ? 'var(--wb-primary)' : tone === 'danger' ? 'var(--wb-danger)' : 'var(--wb-accent)';
    const textC = tone === 'primary' ? 'var(--wb-primary-bright)' : tone === 'danger' ? 'var(--wb-danger-bright)' : 'var(--wb-accent-bright)';
    const el = document.createElement('div');
    el.style.cssText = `background:var(--wb-scrim-soft); border:1px solid var(--wb-border); border-left:3px solid ${borderC}; padding:7px 10px; transition:opacity 240ms;`;
    el.innerHTML = `
      <div style="font-size:13px; color:${textC};">${title}</div>
      ${sub ? `<div style="font-size:11px; color:var(--wb-text-muted); margin-top:2px;">${sub}</div>` : ''}
    `;
    box.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 250); }, 2800);
  }

  function useConsumable(listName, idx) {
    const list = state[listName];
    const slot = list[idx];
    if (!slot) return;
    const def = ITEMS[slot.id];
    if (!def.usable) return;
    if (def.usable === 'heal') {
      if (state.hp >= 10) return;
      state.hp = Math.min(10, state.hp + 3);
    } else if (def.usable === 'buff_meal') {
      state.hp = Math.min(10, state.hp + 1);
      const b = state.buffs.find(x => x.id === 'fed');
      if (b) b.secs = 300;
      else state.buffs.unshift({ id:'fed', icon:'buff_fed', label:'Well-fed', effect:'+15% mining speed', secs:300 });
    } else if (def.usable === 'buff_ration') {
      const b = state.buffs.find(x => x.id === 'fed');
      if (b) b.secs = Math.max(b.secs, 120);
      else state.buffs.unshift({ id:'fed', icon:'buff_fed', label:'Ration', effect:'+5% mining speed', secs:120 });
    } else if (def.usable === 'buff_water') {
      const b = state.buffs.find(x => x.id === 'hyd');
      if (b) b.secs = 180;
      else state.buffs.push({ id:'hyd', icon:'buff_hydrated', label:'Hydrated', effect:'+10% O2 efficiency', secs:180 });
    }
    slot.count -= 1;
    if (slot.count <= 0) list[idx] = null;
    renderAll();
  }

  function showItemTooltip(e, itemId) {
    const item = ITEMS[itemId];
    if (!item) return;
    const qColor = item.quality ? QUALITY_COLORS[item.quality] : '#f2994a';
    const sub = item.quality ? `${item.kind} · <span style="color:${qColor}">${item.quality}</span>` : item.kind;
    showCustomTooltip(e, item.name, sub, item.desc, qColor, item.traits || []);
  }

  function moveTooltip(e) {
    if (tipEl.style.display !== 'block') return;
    const pad = 12;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    const rect = tipEl.getBoundingClientRect();
    if (x + rect.width > window.innerWidth - 8) x = e.clientX - rect.width - pad;
    if (y + rect.height > window.innerHeight - 8) y = window.innerHeight - rect.height - 8;
    tipEl.style.left = Math.max(8, x) + 'px';
    tipEl.style.top = Math.max(8, y) + 'px';
  }

  function hideTooltip() { tipEl.style.display = 'none'; }
  window.addEventListener('mousemove', moveTooltip);

    const isSel = (list, idx) => state.selectedInvSlot && state.selectedInvSlot.list === list && state.selectedInvSlot.idx === idx;

    const makeSlot = (slot, listName, idx, num) => {
      const valid = autoMode && slot && isValidAutoInput(state.activeAutoMachine, slot.id);
      const dimmed = autoMode && slot && !valid;
      return renderSlotHtml(slot, {
        num,
        selected: isSel(listName, idx),
        validIn: valid,
        dimmed,
        dataAttrs: `data-inv-list="${listName}" data-inv-idx="${idx}" data-inv-mode="${mode}"`
      });
    };

    const cargoRows = [];
    for (let row = 0; row < 4; row++) {
      let cells = '';

    let hotbarCells = '';

            <button id="btn-do-craft" data-recipe-set="${recipeSetKey}" data-recipe-id="${sel.id}"
              class="wb-btn wb-btn-primary wb-caps-6 shrink-0" style="min-width:132px; height:40px;" ${ok && !state.machineCrafting ? '' : 'disabled'}>
              <span class="wb-btn-inner">${state.machineCrafting ? 'Crafting...' : craftBtnLabel}</span>
            </button>
            <div class="wb-progress-track flex-1" style="height:8px;">
              <div class="wb-progress-fill" style="width:${state.machineCrafting ? state.machineCraftPct : 0}%; background:var(--wb-primary);"></div>
            </div>
            ${outputSlotHtml}
          </div>
        ` : `
          <button id="btn-do-craft" data-recipe-set="${recipeSetKey}" data-recipe-id="${sel.id}"
            class="wb-btn wb-btn-primary wb-caps-6 w-full" style="height:40px;" ${ok ? '' : 'disabled'}>
            <span class="wb-btn-inner">${craftBtnLabel}</span>
          </button>
        `}
      </div>
    `;
  }

  function renderSegmentedBarHtml(pct, fillColor = 'var(--wb-accent)', dividerColor = 'var(--wb-panel-inner)', height = 8) {
    let divs = '';
    for (let i = 1; i < 10; i++) {
      divs += `<div style="position:absolute; top:0; bottom:0; left:${i * 10}%; width:2px; background:${dividerColor};"></div>`;
    }
    return `
      <div class="wb-progress-track" style="height:${height}px;">
        <div class="wb-progress-fill" style="width:${Math.max(0, Math.min(100, pct))}%; background:${fillColor};"></div>
        ${divs}
      </div>
    `;
  }

  /* =========================================================================
     SURFACE RENDERERS
     ========================================================================= */

  // 1. ACTIVE GAMEPLAY HUD (GAP-2 + GAP-6)
  function renderHudSurface() {
    const activeItem = state.hotbar[state.activeSlot];
    const activeDef = activeItem ? ITEMS[activeItem.id] : null;
    const sk = state.skills[state.activeSkillIdx];
    const skPct = Math.round((sk.xp / sk.xpNext) * 100);

    const hpLow = state.hp <= 2;
    const o2Warn = state.o2 <= 2 && state.o2 > 0;
    const o2Crit = state.o2 === 0;

    let hpPips = '';
    for (let i = 0; i < 10; i++) {
      hpPips += `<div class="w-5 h-5 wb-pip-shadow">${i < state.hp ? ICONS.hp_full : ICONS.hp_empty}</div>`;
    }
    let o2Pips = '';
    for (let i = 0; i < 10; i++) {
      const icon = o2Crit ? ICONS.o2_crit : (i < state.o2 ? (o2Warn ? ICONS.o2_warn : ICONS.o2_full) : ICONS.o2_empty);
      o2Pips += `<div class="w-5 h-5 wb-pip-shadow">${icon}</div>`;
    }

    const buffRows = state.buffs.map(b => `
      <div class="inline-flex items-center gap-1.5 px-1.5 py-0.5 pointer-events-auto cursor-default ${b.secs <= 10 ? 'wb-buff-expiring' : ''}"
           style="background:var(--wb-scrim-soft); border:1px solid var(--wb-border-inner);"
           data-tip-title="${b.label}" data-tip-sub="${fmtTime(b.secs)}" data-tip-desc="${b.effect}" data-tip-color="#6fcf97">
        <div class="w-4 h-4">${ICONS[b.icon]}</div>
        <span class="text-xs tabular-nums" style="color:var(--wb-text);">${fmtTime(b.secs)}</span>
      </div>
    `).join('');

    const hotbarSlots = state.hotbar.map((slot, i) =>
      renderSlotHtml(slot, {
        num: String(i + 1),
        selected: i === state.activeSlot,
        dataAttrs: `data-hud-slot="${i}"`
      })
    ).join('');

    const isBrick = activeDef && (activeDef.kind === 'Brick' || activeDef.kind === 'Entity brick');

    return `
      <!-- Top-Center: 10-Segment Skill XP Bar (BarsView.rml) -->
      ${state.showSkillBar ? `
        <div class="absolute top-5 left-1/2 -translate-x-1/2 flex flex-col items-center pointer-events-none" style="width:460px;">
          <div style="background:var(--wb-panel); width:100%; padding:8px 12px; display:flex; flex-direction:column; gap:5px;">
            <div class="flex items-center justify-between text-sm">
              <span style="color:var(--wb-text);">${sk.name} Lvl ${sk.rank}</span>
              <span style="color:var(--wb-accent-bright);">+${state.lastXpGain} XP (${skPct}%)</span>
            </div>
            ${renderSegmentedBarHtml(skPct, 'var(--wb-accent)', 'var(--wb-panel-solid)', 7)}
          </div>
          <div style="width:100%; height:1px; background:var(--wb-border);"></div>
        </div>
      ` : ''}

      <!-- Chat Layer (ChatView.rml) -->
      ${state.showChat ? `
        <div class="absolute left-5 bottom-36 wb-caps-10 wb-caps-hover" style="width:390px; background:var(--wb-panel); border:1px solid var(--wb-border); padding:2px;">
          <div style="border:1px solid var(--wb-border-inner); background:var(--wb-panel-inner);">
            <div class="flex items-center justify-between px-2.5 py-1 text-[11px]" style="border-bottom:1px solid var(--wb-border-inner); color:var(--wb-accent);">
              <span>SUBSPACE COMMS // LOCAL</span>
              <span style="color:var(--wb-text-muted);">[Esc] CLOSE</span>
            </div>
            <div class="p-2 flex flex-col gap-1 text-xs" style="height:104px;">
              <div><span style="color:var(--wb-accent-bright);">Kizo:</span> <span style="color:var(--wb-text);">Hull sealed. Refinery online.</span></div>
            </div>
            <div class="px-2 py-1.5 flex items-center gap-2 text-xs" style="border-top:1px solid var(--wb-border-inner); background:var(--wb-input);">
              <span style="color:var(--wb-accent);">&gt;</span>
              <span style="color:var(--wb-text-dim);">Enter a message</span>
            </div>
          </div>
        </div>
      ` : ''}

      <!-- Center: Crosshair + GAP-6 Minimalist Reticle Progress Bar (ZERO text, ZERO %) -->
      <div id="reticle-zone" class="absolute inset-0 flex flex-col items-center justify-center cursor-crosshair">
        <div class="relative w-5 h-5 pointer-events-none">
          <div style="position:absolute; left:9px; top:2px; width:2px; height:5px; background:rgba(240,243,246,0.92); box-shadow:0 0 2px #000;"></div>
          <div style="position:absolute; left:9px; bottom:2px; width:2px; height:5px; background:rgba(240,243,246,0.92); box-shadow:0 0 2px #000;"></div>
          <div style="position:absolute; top:9px; left:2px; height:2px; width:5px; background:rgba(240,243,246,0.92); box-shadow:0 0 2px #000;"></div>
          <div style="position:absolute; top:9px; right:2px; height:2px; width:5px; background:rgba(240,243,246,0.92); box-shadow:0 0 2px #000;"></div>
        </div>

        <div class="mt-3 pointer-events-none transition-opacity duration-75" style="width:124px; opacity:${state.miningProgress > 0 ? 1 : 0}; padding:1px; background:#070a10cc;">
          <div class="wb-progress-track" style="height:6px; background:var(--wb-panel-solid); border-color:var(--wb-border-hover);">
            <div class="wb-progress-fill" style="width:${state.miningProgress}%; background:${state.activeSlot === 1 ? 'var(--wb-accent)' : 'var(--wb-primary)'};"></div>
          </div>
        </div>
      </div>

      <!-- Bottom-Left: GAP-2 Borderless Survival Cluster (Hidden in Creative) -->
      ${state.mode === 'adventure' ? `
        <div class="absolute left-5 bottom-5 flex flex-col items-start gap-2 pointer-events-none">
          <div class="flex flex-col items-start gap-1">${buffRows}</div>
          <div class="flex flex-col gap-1.5">
            <div class="flex gap-1 ${hpLow ? 'wb-pulse-danger' : ''}" aria-label="Health">${hpPips}</div>
            <div class="flex gap-1 ${o2Crit ? 'wb-pulse-danger' : o2Warn ? 'wb-pulse-warning' : ''}" aria-label="Oxygen">${o2Pips}</div>
          </div>
        </div>
      ` : ''}

      <!-- Bottom-Center: Unobstructed Action Label + 3D Gizmo + Flush Left-Edge State Grid + Hotbar -->
      <div class="absolute bottom-5 left-1/2 -translate-x-1/2 flex flex-col items-center gap-2 pointer-events-none">
        <div class="flex flex-col items-center gap-1.5">
          ${activeDef ? `<div class="text-sm" style="color:var(--wb-text); text-shadow:0 1px 4px #000;">${activeDef.name}</div>` : ''}
          ${isBrick ? `
            <div class="w-8 h-8 flex items-center justify-center" style="background:var(--wb-scrim-soft); border:1px solid var(--wb-border);">
              <svg viewBox="0 0 24 24" class="w-6 h-6">
                <polygon points="12,3 21,8 12,13 3,8" fill="#4be3e3" fill-opacity="0.35" stroke="#a5f3fc" stroke-width="1.2"/>
                <polygon points="3,8 12,13 12,21 3,16" fill="#2b384e" stroke="#4be3e3" stroke-width="1"/>
                <polygon points="21,8 12,13 12,21 21,16" fill="#162838" stroke="#4be3e3" stroke-width="1"/>
              </svg>
            </div>
          ` : ''}
        </div>

        <div class="flex items-stretch gap-2 pointer-events-auto">
          <!-- Flush 2-high State Stack (30+6+30 = 66px, matching exact 66px Hotbar height) -->
          ${state.mode === 'adventure' ? `
            <div class="flex flex-col justify-between gap-1.5">
              <div class="wb-state-cell cursor-pointer" data-toggle-vacuum="1"
                   style="border-color:${state.inVacuum ? 'var(--wb-danger)' : 'var(--wb-border)'};
                          background:${state.inVacuum ? 'var(--wb-danger-dark)' : 'var(--wb-panel)'};
                          opacity:${state.inVacuum ? 1 : 0.72};"
                   data-tip-title="${state.inVacuum ? 'Vacuum' : 'Pressurized'}"
                   data-tip-sub="${state.inVacuum ? 'Unpressurized environment' : 'Sealed room'}"
                   data-tip-desc="${state.inVacuum ? 'Oxygen tank depleting.' : 'Breathable atmosphere.'}"
                   data-tip-color="${state.inVacuum ? '#e04f7a' : '#6fcf97'}">
                <div class="w-5 h-5">${state.inVacuum ? ICONS.vacuum_on : ICONS.vacuum_off}</div>
              </div>
              <div class="wb-state-cell cursor-pointer" data-toggle-damp="1"
                   style="border-color:${state.dampeners ? 'var(--wb-accent)' : 'var(--wb-warning)'};
                          background:${state.dampeners ? 'var(--wb-accent-dark)' : 'var(--wb-primary-dark)'};"
                   data-tip-title="Inertial dampeners"
                   data-tip-sub="${state.dampeners ? 'Active' : 'Drift'}"
                   data-tip-desc="${state.dampeners ? 'Counter-thrusters stabilize velocity.' : 'Zero-G momentum preserved.'}"
                   data-tip-color="${state.dampeners ? '#4be3e3' : '#f2cc4a'}">
                <div class="w-5 h-5">${state.dampeners ? ICONS.damp_on : ICONS.damp_off}</div>
              </div>
            </div>
          ` : ''}

          <div class="wb-hotbar wb-caps-10 wb-caps-hover">${hotbarSlots}</div>
        </div>
      </div>

      <!-- Bottom-Right: Contextual ControlHints (ControlHintsView.rml) -->
      <div class="absolute right-5 bottom-5 flex flex-col items-end gap-1.5 pointer-events-none">
        ${isBrick ? `
          <div class="wb-hint-pill"><span class="wb-keycap">R</span><span>Change shape</span></div>
          <div class="wb-hint-pill"><span class="wb-keycap">T</span><span>Change orientation</span></div>
        ` : ''}
        <div class="wb-hint-pill"><span class="wb-keycap">Z</span><span>Dampeners</span></div>
        <div class="wb-hint-pill"><span class="wb-keycap">Tab</span><span>Inventory</span></div>
      </div>
    `;
  }

  // 2/3/4. UNIFIED TWO-PANE [TAB] OVERLAY (GAP-3 + Contextual GAP-4A Auto-Processor & GAP-4B Crafter Tabs)
  function renderTabOverlaySurface(contextKind = null) {
    const totalLevel = state.skills.reduce((a, s) => a + s.rank, 0);
    const selInvItem = state.selectedInvSlot ? state[state.selectedInvSlot.list][state.selectedInvSlot.idx] : null;
    const selEquipTarget = selInvItem ? ITEMS[selInvItem.id]?.equipSlot : null;

    // Resolve active tab: contextual 'machine' tab only exists when contextKind is 'auto' or 'recipe'
    const activeTab = (contextKind && state.tabOverlayPane === 'machine')
      ? 'machine'
      : (typeof state.tabOverlayPane === 'number' ? state.tabOverlayPane : 0);

    let contextTabLabel = '';
    let contextTabBody = '';
    if (contextKind === 'auto') {
      const m = AUTO_MACHINES[state.activeAutoMachine];
      const qColor = QUALITY_COLORS[m.quality];
      const powered = state.machinePowered;
      const active = powered && (m.dualRule ? (m.input[0] && m.input[1]) : Boolean(m.input[0]));
      contextTabLabel = m.name;

      const inputSlotsHtml = m.input.map((sl, i) => `
        <div class="flex flex-col items-center gap-1.5">
          ${renderSlotHtml(sl, {
            ghostIcon: m.ghostIcons[i] || m.ghostIcons[0],
            dataAttrs: `data-auto-take-in="${i}"`
          })}
        </div>
      `).join('');

      const outputHtml = m.isO2 ? `
        <button id="btn-refill-o2" class="wb-btn wb-btn-primary wb-btn-compact wb-caps-6">
          <span class="wb-btn-inner">Refill tank</span>
        </button>
      ` : m.isFuel ? `
        <div class="px-2.5 py-1.5 text-xs font-semibold flex items-center gap-1.5"
             style="background:${active ? 'var(--wb-accent-dark)' : 'var(--wb-control)'};
                    border:1px solid ${active ? 'var(--wb-accent)' : 'var(--wb-border)'};
                    color:${active ? 'var(--wb-accent-bright)' : 'var(--wb-text-dim)'};">
          ${ICONS.glyph_bolt}<span>${active ? '+60 kW' : '0 kW'}</span>
        </div>
      ` : renderSlotHtml(m.output, { dataAttrs: `data-auto-collect="1"` });

      contextTabBody = `
        <div class="flex items-center justify-between text-xs px-2.5 py-1.5 mb-4"
             style="background:var(--wb-panel-inner); border:1px solid var(--wb-border-inner);">
          <div>
            <span style="color:${qColor}; font-weight:600;">${m.quality}</span>
            <span style="color:var(--wb-text-muted);"> · ${m.stat}</span>
          </div>
          <span class="inline-flex items-center gap-1" style="color:${powered ? 'var(--wb-success)' : 'var(--wb-danger-bright)'};">
            ${ICONS.glyph_bolt}${powered ? 'Online' : 'Unpowered'}
          </span>
        </div>

        <div class="flex-1 flex items-center justify-center gap-4 px-4"
             style="background:var(--wb-panel-inner); border:1px solid var(--wb-border);">
          <div class="flex flex-col gap-2">${inputSlotsHtml}</div>
          <div class="flex-1 flex flex-col items-center gap-2 max-w-[140px]">
            <div class="wb-progress-track" style="height:8px;">
              <div class="wb-progress-fill" style="width:${m.progress}%; background:${active ? 'var(--wb-primary)' : 'var(--wb-text-dim)'};"></div>
            </div>
          </div>
          <div class="flex items-center justify-center">${outputHtml}</div>
        </div>
      `;
    } else if (contextKind === 'recipe') {
      const key = state.activeRecipeMachine;
      const meta = {
        synthesizer: { name:'Synthesizer', quality:'Common', btn:'Craft', extra:'' },
        factory:     { name:'Factory', quality:'Rare', btn:'Queue batch', extra:' · Conveyer' },
        oven:        { name:'Oven', quality:'Common', btn:'Cook', extra:'' }
      }[key];
      const qColor = QUALITY_COLORS[meta.quality];
      const outSlot = state.machineOutputSlot[key];
      contextTabLabel = meta.name;

      const headerExtra = `
        <div class="flex items-center justify-between text-xs mb-2.5 px-2.5 py-1.5" style="background:var(--wb-panel-inner); border:1px solid var(--wb-border-inner);">
          <div><span style="color:${qColor}; font-weight:600;">${meta.quality}</span><span style="color:var(--wb-text-muted);">${meta.extra}</span></div>
          <span class="inline-flex items-center gap-1" style="color:${state.machinePowered ? 'var(--wb-success)' : 'var(--wb-danger-bright)'};">
            ${ICONS.glyph_bolt}${state.machinePowered ? 'Online' : 'Unpowered'}
          </span>
        </div>
      `;
      const selRecipeId = state.selectedMachineRecipe[key];
      const outHtml = renderSlotHtml(outSlot, {
        ghostIcon: ITEMS[selRecipeId]?.icon,
        dataAttrs:`data-collect-crafter="${key}"`
      });
      contextTabBody = renderRecipePaneHtml(key, selRecipeId, meta.btn, outHtml, headerExtra);
    }

    const spacerStats = [
      { abbr:'STR', name:'Strength', val:3, desc:'Physical power and carrying capacity' },
      { abbr:'PRE', name:'Precision', val:5, desc:'Fine motor control and accuracy' },
      { abbr:'AWA', name:'Awareness', val:6, desc:'Perception and environmental awareness' },
      { abbr:'CHA', name:'Charisma', val:4, desc:'Social presence and negotiation' },
      { abbr:'EDU', name:'Education', val:3, desc:'Technical knowledge and research' },
      { abbr:'RES', name:'Resolve', val:5, desc:'Mental resilience and endurance' }
    ];

    const renderPaperdollSvg = () => {
      const eq = state.equipment;
      const p = (x, y, w, h, f) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;
      let layers = '';
      layers += p(8,40,16,2,'#162838') + p(10,41,12,1,'#4be3e3');
      if (eq.o2) {
        layers += p(6,13,4,13,'#5a6988') + p(7,14,2,10,'#2ce8f5') + p(7,15,1,5,'#ffffff') +
                  p(22,13,4,13,'#5a6988') + p(23,14,2,10,'#2ce8f5') + p(23,15,1,5,'#ffffff') +
                  p(6,12,4,1,'#feae34') + p(22,12,4,1,'#feae34') +
                  p(7,26,2,2,'#3a4466') + p(23,26,2,2,'#3a4466');
      }
      if (eq.legs) {
        layers += p(11,26,4,12,'#3a4466') + p(17,26,4,12,'#3a4466') +
                  p(12,27,2,9,'#5a6988') + p(18,27,2,9,'#5a6988') +
                  p(10,36,5,4,'#8b9bb4') + p(17,36,5,4,'#8b9bb4') +
                  p(10,39,5,1,'#f77622') + p(17,39,5,1,'#f77622');
      } else {
        layers += p(11,26,4,13,'#265c42') + p(17,26,4,13,'#265c42') +
                  p(12,27,2,10,'#3e8948') + p(18,27,2,10,'#3e8948') +
                  p(10,38,5,2,'#193c3e') + p(17,38,5,2,'#193c3e');
      }
      if (eq.suit) {
        layers += p(9,13,14,14,'#8b9bb4') + p(10,14,12,12,'#c0cbdc') +
                  p(11,15,10,4,'#5a6988') + p(13,16,6,2,'#181425') + p(14,16,4,2,'#2ce8f5') +
                  p(10,23,12,2,'#3a4466') + p(14,23,4,2,'#f77622') +
                  p(6,14,3,4,'#c0cbdc') + p(23,14,3,4,'#c0cbdc') +
                  p(6,15,3,1,'#f77622') + p(23,15,3,1,'#f77622') +
                  p(6,18,3,8,'#8b9bb4') + p(23,18,3,8,'#8b9bb4') +
                  p(6,26,3,3,'#3a4466') + p(23,26,3,3,'#3a4466');
      } else if (eq.torso) {
        layers += p(10,13,12,14,'#262b44') + p(11,14,10,12,'#3a4466') +
                  p(13,15,6,3,'#5a6988') + p(10,23,12,2,'#181425') +
                  p(7,14,3,11,'#3a4466') + p(22,14,3,11,'#3a4466') +
                  p(7,25,3,3,'#3e8948') + p(22,25,3,3,'#3e8948');
      } else {
        layers += p(10,13,12,14,'#265c42') + p(11,14,10,12,'#3e8948') +
                  p(7,14,3,13,'#3e8948') + p(22,14,3,13,'#3e8948');
      }
      layers += p(11,4,10,8,'#3e8948') + p(10,6,12,5,'#63c74d') +
                p(12,7,2,2,'#fee761') + p(18,7,2,2,'#fee761') +
                p(13,7,1,1,'#181425') + p(19,7,1,1,'#181425') +
                p(14,10,4,1,'#193c3e');
      if (eq.head) {
        layers += p(10,5,12,2,'#5a6988') + p(11,6,10,2,'#2ce8f5') + p(12,6,3,1,'#ffffff');
      }
      if (eq.helmet) {
        layers += p(10,2,12,1,'#c0cbdc') + p(9,3,14,1,'#8b9bb4') +
                  p(8,4,1,8,'#8b9bb4') + p(23,4,1,8,'#8b9bb4') +
                  p(9,12,14,2,'#5a6988') + p(11,12,10,1,'#feae34') +
                  `<rect x="9" y="4" width="14" height="8" fill="#2ce8f5" fill-opacity="0.24"/>` +
                  p(10,4,2,3,'#ffffff') + p(12,4,2,1,'#a5f3fc');
      }
      return `<svg viewBox="0 0 32 44" shape-rendering="crispEdges" class="w-full h-full block">${layers}</svg>`;
    };

    const eqSlotMeta = [
      { key:'head',   col:'left',  label:'Head',       ghost:'eq_head' },
      { key:'torso',  col:'left',  label:'Torso',      ghost:'eq_torso' },
      { key:'legs',   col:'left',  label:'Legs',       ghost:'eq_legs' },
      { key:'helmet', col:'right', label:'Helmet',     ghost:'eq_helmet' },
      { key:'suit',   col:'right', label:'Space suit', ghost:'suit' },
      { key:'o2',     col:'right', label:'O2 / Pack',  ghost:'o2_tank' }
    ];

    const renderEquipCol = (col) => eqSlotMeta.filter(m => m.col === col).map(m => {
      const equippedItem = state.equipment[m.key];
      const validDrop = selEquipTarget === m.key;
      const emptyTip = equippedItem ? '' : `data-tip-title="${m.label}" data-tip-sub="Empty slot" data-tip-desc="Select gear in inventory or double-click to equip." data-tip-color="#8da0b8"`;
      return renderSlotHtml(equippedItem, {
        equipped: Boolean(equippedItem) && !validDrop,
        validIn: validDrop,
        ghostIcon: m.ghost,
        dataAttrs: `data-equip-slot="${m.key}" ${emptyTip}`
      });
    }).join('');

    const augThresholds = [10, 25, 50, 75, 100];
    const augScore = 2 * 5 + 0;
    const augmentSlotsHtml = augThresholds.map((req, idx) => {
      const unlocked = augScore >= req;
      const slotted = unlocked ? state.augments[idx] : null;
      const validDrop = unlocked && selEquipTarget === 'augment';
      if (!unlocked) {
        return `
          <div class="w-10 h-10 flex items-center justify-center cursor-default"
               style="background:var(--wb-panel-inner); border:1px solid var(--wb-border-inner); color:var(--wb-text-dim);"
               data-tip-title="Augment slot ${idx + 1}"
               data-tip-sub="Locked"
               data-tip-desc="Requires (2 × Resolve) + Cybernetics ≥ ${req}. Current: ${augScore}."
               data-tip-color="#8da0b8">
            ${ICONS.glyph_lock}
          </div>
        `;
      }
      return `
        <div class="wb-slot ${validDrop ? 'wb-slot-valid-in' : (slotted ? 'wb-slot-equipped' : '')}" style="width:40px; height:40px;"
             data-aug-slot="${idx}"
             ${slotted ? `data-tip-item="${slotted.id}"` : `data-tip-title="Augment slot ${idx + 1}" data-tip-sub="Unlocked" data-tip-desc="Cybernetic, chip, or nanotech socket." data-tip-color="#4be3e3"`}>
          ${slotted ? `<div class="w-7 h-7 pointer-events-none">${ICONS[ITEMS[slotted.id].icon]}</div>` : `<div class="w-6 h-6 opacity-25 pointer-events-none">${ICONS.eq_augment}</div>`}
        </div>
      `;
    }).join('');

    const skillCards = state.skills.map(sk => {
      const pct = Math.round((sk.xp / sk.xpNext) * 100);
      const badges = sk.milestones.map(m => {
        const unlocked = sk.rank >= m.r;
        return `
          <span class="px-1.5 py-0.5 text-[10px] cursor-default"
                style="background:${unlocked ? 'var(--wb-accent-dark)' : 'var(--wb-control)'};
                       border:1px solid ${unlocked ? 'var(--wb-accent)' : 'var(--wb-border)'};
                       color:${unlocked ? 'var(--wb-accent-bright)' : 'var(--wb-text-dim)'};"
                data-tip-title="${sk.name} · Rank ${m.r}"
                data-tip-sub="${unlocked ? 'Unlocked' : 'Locked'}"
                data-tip-desc="${m.text}"
                data-tip-color="${unlocked ? '#4be3e3' : '#8da0b8'}">
            ${m.r}${unlocked ? ' ✓' : ''}
          </span>
        `;
      }).join('');
      return `
        <div class="p-2.5 flex gap-2.5" style="background:var(--wb-panel-inner); border:1px solid var(--wb-border);">
          <div class="w-10 h-10 p-1 shrink-0 self-center" style="background:var(--wb-control); border:1px solid var(--wb-border-inner);">
            ${ICONS[sk.icon]}
          </div>
          <div class="flex-1 min-w-0 flex flex-col gap-1">
            <div class="flex items-center justify-between">
              <span class="text-sm font-medium" style="color:var(--wb-text);">${sk.name}</span>
              <span class="text-xs font-semibold" style="color:var(--wb-primary);">Lvl ${sk.rank}</span>
            </div>
            ${renderSegmentedBarHtml(pct, 'var(--wb-accent)', 'var(--wb-panel-inner)', 6)}
            <div class="flex items-center justify-between text-[11px]" style="color:var(--wb-text-muted);">
              <span>${sk.scaling}</span>
              <span class="tabular-nums">${sk.xp} / ${sk.xpNext} XP</span>
            </div>
            <div class="flex items-center gap-1 mt-0.5">${badges}</div>
          </div>
        </div>
      `;
    }).join('');

    const rightPaneContent = activeTab === 'machine' ? contextTabBody
      : activeTab === 0 ? `
        <div class="wb-panel-header">Suit crafting</div>
        <div class="mt-1 mb-3 wb-divider-inner"></div>
        ${renderRecipePaneHtml('suit', state.selectedSuitRecipe, 'Craft')}
      ` : activeTab === 1 ? `
        <div class="text-center mb-2">
          <div class="text-base font-semibold leading-tight" style="color:var(--wb-text);">Kizo Horo'Krul</div>
          <div class="text-xs mt-0.5" style="color:var(--wb-accent-bright);">Level ${totalLevel} · Gorbulan</div>
        </div>

        <div class="flex items-center justify-center gap-3.5 flex-1 min-h-0">
          <div class="flex flex-col gap-2.5">${renderEquipCol('left')}</div>

          <div class="wb-caps-6 flex-1 max-w-[236px] h-[238px] flex items-center justify-center p-2 relative overflow-hidden"
               style="background:var(--wb-panel-inner); border:1px solid var(--wb-border);">
            <div class="absolute inset-0 pointer-events-none opacity-15"
                 style="background-image:repeating-linear-gradient(0deg, transparent 0 7px, #4be3e3 7px 8px);"></div>
            <div class="w-[152px] h-[208px] relative z-10">${renderPaperdollSvg()}</div>
          </div>

          <div class="flex flex-col gap-2.5">${renderEquipCol('right')}</div>
        </div>

        <div class="flex items-center justify-center gap-2 mt-2.5 mb-3">${augmentSlotsHtml}</div>

        <div class="mb-2" style="border:1px solid var(--wb-border-inner); background:var(--wb-panel-inner);">
          <div class="grid grid-cols-6 divide-x divide-[#1a2333]">
            ${spacerStats.map(st => `
              <div class="wb-spacer-cell h-[30px] flex items-center justify-center gap-1.5 cursor-default"
                   data-tip-title="${st.name}" data-tip-sub="S.P.A.C.E.R. · ${st.val} / 8" data-tip-desc="${st.desc}" data-tip-color="#f2994a">
                <span class="text-xs font-bold" style="color:var(--wb-primary);">${st.name[0]}</span>
                <span class="text-xs font-semibold tabular-nums" style="color:var(--wb-text);">${st.val}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="flex items-center gap-1.5 min-h-[24px]">
          ${state.buffs.length ? state.buffs.map(b => `
            <div class="inline-flex items-center gap-1.5 px-2 py-0.5 text-xs cursor-default"
                 style="background:var(--wb-panel-inner); border:1px solid var(--wb-border-inner);"
                 data-tip-title="${b.label}" data-tip-sub="${fmtTime(b.secs)}" data-tip-desc="${b.effect}" data-tip-color="#6fcf97">
              <div class="w-3.5 h-3.5 shrink-0">${ICONS[b.icon]}</div>
              <span class="tabular-nums" style="color:var(--wb-accent-bright);">${fmtTime(b.secs)}</span>
            </div>
          `).join('') : `<span class="text-[11px]" style="color:var(--wb-text-dim);">No active buffs</span>`}
        </div>
      ` : `
        <div class="flex items-center justify-between">
          <span class="w-24"></span>
          <span class="wb-panel-header">Skills</span>
          <span class="text-xs text-right w-24" style="color:var(--wb-accent);">Level ${totalLevel}</span>
        </div>
        <div class="mt-1 mb-2.5 wb-divider-inner"></div>
        <div class="wb-scroll flex-1 overflow-y-auto pr-1 flex flex-col gap-2">${skillCards}</div>
      `;

    const invMode = (contextKind === 'auto' && activeTab === 'machine') ? 'auto-insert' : 'normal';
    const primaryHint = invMode === 'auto-insert' ? 'Quick insert' : 'Move / equip';

    return `
      <div class="absolute inset-0 flex items-center justify-center p-6" style="background:var(--wb-scrim-soft);">
        <div class="w-full max-w-[1032px] h-[524px] flex gap-4">
          <!-- Persistent Left Pane: Pure 9x4 Inventory + 9x1 Hotbar -->
          <div class="flex flex-col w-[514px] shrink-0 pt-[34px]">
            <div class="wb-panel wb-caps-10 flex-1 min-h-0">
              <div class="wb-panel-inner">
                <div class="wb-panel-header">Inventory</div>
                <div class="mt-1 mb-3 wb-divider-inner"></div>
                <div class="flex-1 flex flex-col justify-center">
                  ${renderInventoryGridHtml(invMode)}
                </div>
              </div>
            </div>
          </div>

          <!-- Tabbed Right Pane: [Contextual Machine Tab (only on F-interact)] | Crafting | Colonist | Skills -->
          <div class="flex-1 min-w-0 flex flex-col">
            <div class="flex items-end justify-between -mb-[1px] h-[35px]">
              <div class="flex gap-1.5">
                ${contextKind ? `
                  <button data-tab-pane="machine" class="wb-tab ${activeTab === 'machine' ? 'wb-tab-selected' : ''}"
                          style="${activeTab !== 'machine' ? 'border-color:var(--wb-primary-dark); color:var(--wb-primary-bright);' : ''}">
                    ${contextTabLabel}
                  </button>
                ` : ''}
                <button data-tab-pane="0" class="wb-tab ${activeTab === 0 ? 'wb-tab-selected' : ''}">Crafting</button>
                <button data-tab-pane="1" class="wb-tab ${activeTab === 1 ? 'wb-tab-selected' : ''}">Colonist</button>
                <button data-tab-pane="2" class="wb-tab ${activeTab === 2 ? 'wb-tab-selected' : ''}">Skills</button>
              </div>
              <button data-close-to-hud="1" class="wb-icon-btn mb-1" aria-label="Close">${ICONS.glyph_x}</button>
            </div>
            <div class="wb-panel wb-caps-10 flex-1 min-h-0">
              <div class="wb-panel-inner">
                ${rightPaneContent}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="absolute right-5 bottom-5 flex flex-col items-end gap-1.5 pointer-events-none">
        <div class="wb-hint-pill"><span class="wb-keycap">LMB</span><span>${primaryHint}</span></div>
        <div class="wb-hint-pill"><span class="wb-keycap">${contextKind ? 'Esc' : 'Tab'}</span><span>Close</span></div>
      </div>
    `;
  }

  function renderAutoProcessorSurface() { return renderTabOverlaySurface('auto'); }
  function renderRecipeCrafterSurface() { return renderTabOverlaySurface('recipe'); }

  // 5. [F] COMPUTER CENTRAL GRID TERMINAL (GAP-5: Cassette-Futurism CRT Alt + Standard Reef)
  function renderComputerSurface() {
    const bpLimit = 3;
    const usedSlots = 64;
    const maxSlots = 80;
    const storagePct = Math.round((usedSlots / maxSlots) * 100);
    const filteredBps = state.blueprints.filter(b => b.name.toLowerCase().includes(state.bpSearch.toLowerCase()));

    const activeLoad = state.gridMachines.filter(m => m.enabled && m.kw < 0).reduce((a, m) => a + Math.abs(m.kw), 0);
    const genOnline = state.gridMachines.find(m => m.id === 'm6').enabled;
    const totalGen = 18 + (genOnline ? 60 : 0);
    const loadPct = Math.min(100, Math.round((activeLoad / Math.max(1, totalGen)) * 100));
    const gridOk = totalGen >= activeLoad;
    const powerColor = !gridOk ? 'var(--wb-danger)' : loadPct > 80 ? 'var(--wb-warning)' : 'var(--wb-accent)';

    if (state.computerStyle === 'crt') {
      const palettes = {
        cyan:  { bg:'#071116', fg:'#4be3e3', bright:'#a5f3fc', dim:'#245363', warn:'#f2cc4a' },
        amber: { bg:'#120c06', fg:'#f2994a', bright:'#ffd27d', dim:'#663f1d', warn:'#fee761' },
        green: { bg:'#07120b', fg:'#6fcf97', bright:'#b8f5cf', dim:'#24573a', warn:'#f2cc4a' },
        mono:  { bg:'#13121c', fg:'#c0cbdc', bright:'#ffffff', dim:'#5a6988', warn:'#ead4aa' }
      };
      const pal = palettes[state.crtTint] || palettes.cyan;
      const crtVars = `--crt-bg:${pal.bg}; --crt-fg:${pal.fg}; --crt-bright:${pal.bright}; --crt-dim:${pal.dim};`;

      // 8x8 pixel screw sprite (tiny UI texture in Reef)
      const screwSvg = `<svg viewBox="0 0 8 8" shape-rendering="crispEdges" class="w-2.5 h-2.5 shrink-0 block">
        <rect x="1" y="0" width="6" height="8" fill="#0b0e14"/><rect x="0" y="1" width="8" height="6" fill="#0b0e14"/>
        <rect x="1" y="1" width="6" height="6" fill="#3a4466"/><rect x="1" y="1" width="4" height="2" fill="#5a6988"/>
        <rect x="2" y="3" width="4" height="2" fill="#181425"/>
      </svg>`;

      // 8x8 pixel LED sprite (flat square Reef bezel + lit pixel core, zero CSS glow)
      const ledBox = (color) => `<span class="inline-block w-2.5 h-2.5 shrink-0" style="background:${color}; border:1px solid #0b0e14; padding:1px;"><span class="block w-1 h-1" style="background:#ffffff99;"></span></span>`;

      // Reef-native segmented ProgressBar styled in CRT phosphor colors
      const crtBar = (pct, fillC) => {
        let divs = '';
        for (let i = 1; i < 10; i++) {
          divs += `<div style="position:absolute; top:0; bottom:0; left:${i * 10}%; width:2px; background:${pal.bg};"></div>`;
        }
        return `
          <div style="position:relative; height:8px; width:100%; background:${pal.bg}; border:1px solid ${pal.dim}; overflow:hidden;">
            <div style="height:100%; width:${Math.max(0, Math.min(100, pct))}%; background:${fillC}; transition:width 100ms linear;"></div>
            ${divs}
          </div>
        `;
      };

      const louvers = Array.from({ length: 14 }, () => `<span style="width:14px; height:3px; background:#0b0e14; border-bottom:1px solid #2b384e;"></span>`).join('');

      return `
        <div class="absolute inset-0 flex items-center justify-center p-5" style="background:var(--wb-scrim);">
          <!-- Reef-Feasible Stepped Cassette-Futurism Chassis (flat fills + per-side bevels + corner-caps) -->
          <div class="wb-crt-chassis wb-caps-10 wb-caps-hover w-full max-w-[1056px] h-[564px] p-2.5 flex flex-col" style="${crtVars}">
            <div class="wb-crt-bezel-inner flex-1 min-h-0 p-2.5 flex flex-col gap-2.5">
              <!-- Top Hardware Bezel: Pixel Screws, Stamped Tag, Pure-Rect Louvers -->
              <div class="flex items-center justify-between px-0.5">
                <div class="flex items-center gap-2">
                  ${screwSvg}
                  <span class="text-[11px] font-bold tracking-widest uppercase px-2 py-0.5"
                        style="background:#111723; border:1px solid #2b384e; color:#8da0b8;">
                    WAY-OS // TERM-04
                  </span>
                </div>
                <div class="flex items-center gap-1">${louvers}</div>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] tracking-wider uppercase" style="color:#5a6988;">ASTEROID_OUTPOST_01</span>
                  ${screwSvg}
                </div>
              </div>

              <!-- Recessed CRT Monitor Well (inverted per-side Reef bevel) -->
              <div class="wb-crt-well flex-1 min-h-0 flex">
                <div class="wb-crt-screen flex-1 flex flex-col p-3.5 min-h-0">
                  <!-- Optional Simple Reef Overlay Textures (passthrough="true") -->
                  ${state.crtTextures ? `<div class="wb-crt-tex-scanlines"></div><div class="wb-crt-tex-vignette"></div>` : ''}

                  <!-- Inverted Phosphor Telemetry Banner (pure flat fill + dark text) -->
                  <div class="flex items-center justify-between px-2.5 py-1 mb-3 text-xs font-bold tracking-wide shrink-0 relative z-10"
                       style="background:var(--crt-fg); color:var(--crt-bg);">
                    <span>GRID://ASTEROID_OUTPOST_01</span>
                    <div class="flex items-center gap-4 tabular-nums">
                      <span>BRICKS:0412</span>
                      <span>ATMO:${state.gridSealed ? 'SEALED' : 'BREACH!'}</span>
                      <span>BUS:${String(activeLoad).padStart(2,'0')}/${String(totalGen).padStart(2,'0')}KW</span>
                    </div>
                  </div>

                  <!-- Two-Column Phosphor Terminal Body -->
                  <div class="grid grid-cols-2 gap-4 flex-1 min-h-0 relative z-10">
                    <!-- Left CRT Column: Grid Bus + Machine Nodes -->
                    <div class="flex flex-col min-h-0 pr-3" style="border-right:1px dashed var(--crt-dim);">
                      <div class="text-[11px] font-bold tracking-wider mb-1.5" style="color:var(--crt-bright);">[01] GRID BUS TELEMETRY</div>
                      <div class="p-2 mb-3 text-xs flex flex-col gap-2" style="border:1px solid var(--crt-dim);">
                        <div class="flex items-center justify-between">
                          <span>POWER LOAD</span>
                          <span class="tabular-nums font-bold" style="color:${gridOk ? 'var(--crt-bright)' : '#ff8da6'};">
                            ${gridOk ? 'ONLINE' : 'OVERLOAD!'} · ${activeLoad}/${totalGen} kW
                          </span>
                        </div>
                        ${crtBar(loadPct, gridOk ? pal.fg : '#e04f7a')}
                        <div class="flex items-center justify-between pt-1.5" style="border-top:1px dashed var(--crt-dim);">
                          <span>BULKHEAD SEAL</span>
                          <button id="btn-toggle-seal" class="wb-crt-btn ${state.gridSealed ? '' : 'wb-crt-btn-danger'}">
                            ${state.gridSealed ? '■ SEALED 100% O2' : '▲ VACUUM BREACH'}
                          </button>
                        </div>
                      </div>

                      <div class="flex items-center justify-between text-[11px] font-bold tracking-wider mb-1.5" style="color:var(--crt-bright);">
                        <span>[02] MACHINE NODES (${String(state.gridMachines.length).padStart(2,'0')})</span>
                        <span style="color:var(--crt-dim);">BUS / STATE / PWR</span>
                      </div>
                      <div class="wb-scroll flex-1 overflow-y-auto flex flex-col gap-1 pr-1 text-xs">
                        ${state.gridMachines.map((m, i) => {
                          const st = !m.enabled ? 'OFFLINE' : (!gridOk && m.kw < 0 ? 'NO_PWR' : m.status.toUpperCase());
                          const stBad = st === 'OFFLINE' || st === 'NO_PWR';
                          const codeName = m.name.toUpperCase().replace(/\s+/g, '_');
                          return `
                            <div class="flex items-center justify-between gap-2 px-2 py-1"
                                 style="border:1px solid ${stBad ? '#5a2235' : 'var(--crt-dim)'}; background:${m.enabled ? 'transparent' : '#05080c80'};">
                              <div class="flex items-center gap-2 min-w-0">
                                <span style="color:var(--crt-dim);">${String(i+1).padStart(2,'0')}</span>
                                <span class="truncate" style="color:${m.enabled ? 'var(--crt-bright)' : 'var(--crt-dim)'};">${codeName}</span>
                              </div>
                              <div class="flex items-center gap-2.5 shrink-0 tabular-nums">
                                <span style="color:var(--crt-dim);">${m.kw > 0 ? '+' : ''}${m.kw}kW</span>
                                <span class="w-16 text-right font-bold" style="color:${stBad ? '#ff8da6' : st === 'IDLE' ? pal.warn : 'var(--crt-fg)'};">${st}</span>
                                <button data-toggle-machine="${m.id}" class="wb-crt-btn ${m.enabled ? '' : 'wb-crt-btn-danger'}" style="min-width:46px;">
                                  ${m.enabled ? '■ ON' : '□ OFF'}
                                </button>
                              </div>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    </div>

                    <!-- Right CRT Column: Cargo Manifest + Blueprint Tape Deck -->
                    <div class="flex flex-col min-h-0">
                      <div class="flex items-center justify-between text-[11px] font-bold tracking-wider mb-1.5" style="color:var(--crt-bright);">
                        <span>[03] CARGO MANIFEST</span>
                        <span class="tabular-nums">${usedSlots}/${maxSlots} SLOTS</span>
                      </div>
                      <div class="p-2 mb-3 text-xs flex flex-col gap-2" style="border:1px solid var(--crt-dim);">
                        ${crtBar(storagePct, pal.fg)}
                        <div class="grid grid-cols-2 gap-x-4 gap-y-0.5 text-[11px] pt-1" style="border-top:1px dashed var(--crt-dim);">
                          <div class="flex justify-between"><span>RAW_ICE</span><span style="color:var(--crt-bright);">12</span></div>
                          <div class="flex justify-between"><span>IRON_STD</span><span style="color:var(--crt-bright);">08</span></div>
                          <div class="flex justify-between"><span>RAW_ROCK</span><span style="color:var(--crt-bright);">14</span></div>
                          <div class="flex justify-between"><span>CU_WIRE</span><span style="color:var(--crt-bright);">06</span></div>
                        </div>
                      </div>

                      <div class="flex items-center justify-between text-[11px] font-bold tracking-wider mb-1.5" style="color:var(--crt-bright);">
                        <span>[04] BLUEPRINT TAPE DECK</span>
                        <span class="tabular-nums">SLOTS ${state.blueprints.filter(b => !b.builtIn).length}/${bpLimit}</span>
                      </div>

                      <div class="flex items-center gap-2 mb-1.5 text-xs">
                        <span style="color:var(--crt-bright);">&gt; SAVE</span>
                        <input id="bp-new-name" type="text" value="${state.bpNewName}" placeholder="blueprint_id" class="wb-crt-input flex-1" />
                        <button id="btn-save-bp" class="wb-crt-btn font-bold">[WRITE]</button>
                      </div>
                      <div class="flex items-center gap-2 mb-2 text-xs">
                        <span style="color:var(--crt-dim);">&gt; FIND</span>
                        <input id="bp-search" type="text" value="${state.bpSearch}" placeholder="filter..." class="wb-crt-input flex-1" />
                      </div>

                      <div class="wb-scroll flex-1 overflow-y-auto flex flex-col gap-1 pr-1 text-xs">
                        ${filteredBps.map((bp, idx) => `
                          <div class="flex items-center justify-between gap-2 px-2 py-1.5" style="border:1px solid var(--crt-dim);">
                            <div class="min-w-0">
                              <div class="truncate font-bold" style="color:var(--crt-bright);">
                                <span style="color:var(--crt-dim);">T-${String(idx+1).padStart(2,'0')}</span> ${bp.name.toUpperCase()}
                              </div>
                              <div class="text-[10px]" style="color:var(--crt-dim);">${bp.dims}${bp.builtIn ? ' · ROM' : ''}</div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                              ${state.bpConfirmDelete === bp.id ? `
                                <button data-bp-confirm-del="${bp.id}" class="wb-crt-btn wb-crt-btn-danger">[CONF?]</button>
                                <button data-bp-cancel-del="1" class="wb-crt-btn">[NO]</button>
                              ` : `
                                <button data-bp-load="${bp.id}" class="wb-crt-btn">[LOAD]</button>
                                ${!bp.builtIn ? `<button data-bp-req-del="${bp.id}" class="wb-crt-btn wb-crt-btn-danger">[DEL]</button>` : ''}
                              `}
                            </div>
                          </div>
                        `).join('')}
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Bottom Hardware Bezel: Pixel LEDs + Beveled Reef Key -->
              <div class="flex items-center justify-between px-0.5">
                <div class="flex items-center gap-4 text-[10px] tracking-wider uppercase" style="color:#8da0b8;">
                  ${screwSvg}
                  <span class="inline-flex items-center gap-1.5">${ledBox(gridOk ? '#6fcf97' : '#e04f7a')}PWR</span>
                  <span class="inline-flex items-center gap-1.5">${ledBox(state.gridSealed ? '#4be3e3' : '#e04f7a')}SEAL</span>
                  <span class="inline-flex items-center gap-1.5">${ledBox('#f2994a')}TAPE</span>
                </div>

                <div class="flex items-center gap-2.5">
                  <button data-close-to-hud="1" class="wb-crt-key">[ESC] DISCONNECT</button>
                  ${screwSvg}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    return `
      <div class="absolute inset-0 flex items-center justify-center p-6" style="background:var(--wb-scrim);">
        <div class="w-full max-w-[1040px] h-[540px] flex gap-4">
          <!-- Left Pane: Grid Status + Machine Registry -->
          <div class="wb-panel wb-caps-10 flex-1 min-h-0">
            <div class="wb-panel-inner">
              <div class="wb-panel-header">Asteroid Outpost 01</div>
              <div class="mt-1 mb-3 wb-divider-inner"></div>

              <!-- 1. Grid Status -->
              <div class="p-2.5 mb-3 flex flex-col gap-2 text-xs" style="background:var(--wb-panel-inner); border:1px solid var(--wb-border);">
                <div class="flex justify-between">
                  <span style="color:var(--wb-text-muted);">Bricks</span>
                  <span>412</span>
                </div>
                <div class="flex justify-between items-center">
                  <span style="color:var(--wb-text-muted);">Atmosphere</span>

  /* =========================================================================
     MASTER RENDER & EVENTS
     ========================================================================= */
  function renderAll() {
    hideTooltip();

    document.querySelectorAll('.nav-btn').forEach(btn => {
      const active = btn.dataset.surface === state.surface;
      btn.style.background = active ? 'var(--primary)' : 'transparent';
      btn.style.color = active ? 'var(--primary-foreground)' : 'var(--foreground)';
      btn.style.borderColor = active ? 'var(--primary)' : 'var(--border)';
    });

    renderToolbar();

    const layer = document.getElementById('stage-layer');
    switch (state.surface) {
      case 'hud': layer.innerHTML = renderHudSurface(); break;
      case 'tab-inv': layer.innerHTML = renderTabOverlaySurface(); break;
      case 'machine-auto': layer.innerHTML = renderAutoProcessorSurface(); break;
      case 'machine-recipe': layer.innerHTML = renderRecipeCrafterSurface(); break;
      case 'computer': layer.innerHTML = renderComputerSurface(); break;
      case 'death': layer.innerHTML = renderDeathSurface(); break;
      case 'new-save': layer.innerHTML = renderNewSaveSurface(); break;
      case 'icon-sheet': layer.innerHTML = renderIconSheetSurface(); break;
    }
    bindStageEvents();
  }

  function bindStageEvents() {
    document.querySelectorAll('[data-tip-item]').forEach(el => {
      el.addEventListener('mouseenter', e => showItemTooltip(e, el.dataset.tipItem));

      el.addEventListener('mouseenter', e => showCustomTooltip(e, el.dataset.tipTitle, el.dataset.tipSub, el.dataset.tipDesc, el.dataset.tipColor || '#4be3e3'));
      el.addEventListener('mouseleave', hideTooltip);

    // Toolbar controls
    const ctlMode = document.getElementById('ctl-mode');

    const ctlHp = document.getElementById('ctl-hp');

    // Two-way Inventory <-> Hero Paperdoll Equipment & Augmentation slots
    const findFreeInvSlot = () => state.inventory.findIndex(s => !s);
    document.querySelectorAll('[data-equip-slot]').forEach(el => {
      el.onclick = () => {
        const key = el.dataset.equipSlot;
        if (state.selectedInvSlot) {

            state.equipment[key] = invItem;
            state[list][idx] = prev;
            state.selectedInvSlot = null;

    // Inventory clicks (move/swap, auto-insert, double-click quick-equip or consume)
    document.querySelectorAll('[data-inv-list]').forEach(el => {
      const listName = el.dataset.invList;
      const idx = +el.dataset.invIdx;
      const mode = el.dataset.invMode;

      el.onclick = () => {
        if (mode === 'auto-insert') {
          const sl = state[listName][idx];
          if (!sl || !isValidAutoInput(state.activeAutoMachine, sl.id)) return;
          const m = AUTO_MACHINES[state.activeAutoMachine];
          if (m.dualRule) {
            const targetIdx = sl.id === m.dualRule.a ? 0 : 1;
            if (!m.input[targetIdx] || m.input[targetIdx].id === sl.id) {
              m.input[targetIdx] = { id:sl.id, count:(m.input[targetIdx]?.count || 0) + sl.count };
              state[listName][idx] = null;
              renderAll();
            }
          } else if (!m.input[0] || m.input[0].id === sl.id) {
            m.input[0] = { id:sl.id, count:(m.input[0]?.count || 0) + sl.count };
            state[listName][idx] = null;
            renderAll();
          }
          return;
        }
        if (!state.selectedInvSlot) {
          if (state[listName][idx]) { state.selectedInvSlot = { list: listName, idx }; renderAll(); }
        } else {
          const prev = state.selectedInvSlot;
          if (prev.list === listName && prev.idx === idx) { state.selectedInvSlot = null; renderAll(); return; }
          const tmp = state[prev.list][prev.idx];
          state[prev.list][prev.idx] = state[listName][idx];
          state[listName][idx] = tmp;
          state.selectedInvSlot = null;
          renderAll();
        }
      };
      el.ondblclick = () => {
        state.selectedInvSlot = null;
        const sl = state[listName][idx];
        if (!sl) return;
        const def = ITEMS[sl.id];
        if (def?.equipSlot) {
          if (def.equipSlot === 'augment') {
            const prev = state.augments[0];
            state.augments[0] = sl;
            state[listName][idx] = prev;
          } else {
            const prev = state.equipment[def.equipSlot];
            state.equipment[def.equipSlot] = sl;
            state[listName][idx] = prev;
          }
          renderAll();
          return;
        }
        useConsumable(listName, idx);
      };

        rec.reqs.forEach(req => consumeItem(req.id, req.qty));

          addItem(rec.id, rec.outQty);
          grantSkillXp('manufacturing', 25);
          renderAll();
        } else {
          state.machineCrafting = true;
          state.machineCraftPct = 15;
          renderAll();
          const timer = setInterval(() => {
            state.machineCraftPct += 30;
            if (state.machineCraftPct >= 100) {
              clearInterval(timer);
              state.machineCrafting = false;
              state.machineCraftPct = 0;
              const cur = state.machineOutputSlot[set];
              if (cur && cur.id === rec.id) cur.count += rec.outQty;
              else state.machineOutputSlot[set] = { id: rec.id, count: rec.outQty };

  function runAutoProcessCycle(key) {
    const m = AUTO_MACHINES[key];
    if (!state.machinePowered) return;
    if (m.dualRule) {
      if (m.input[0] && m.input[1]) {
        m.input[0].count -= 1; if (m.input[0].count <= 0) m.input[0] = null;
        m.input[1].count -= 1; if (m.input[1].count <= 0) m.input[1] = null;
        m.output = { id: m.dualRule.out, count: (m.output?.count || 0) + m.dualRule.outQty };
        m.progress = 0;
      }
      return;
    }
    const inp = m.input[0];
    if (!inp || !m.rules || !m.rules[inp.id]) return;
    const rule = m.rules[inp.id];
    if (inp.count < rule.inQty) return;
    inp.count -= rule.inQty;
    if (inp.count <= 0) m.input[0] = null;
    if (rule.o2Boost) {
      state.o2 = Math.min(10, state.o2 + rule.o2Boost);
    } else if (rule.out) {
      m.output = { id: rule.out, count: (m.output?.count || 0) + rule.outQty };
      grantSkillXp(key === 'recycler' ? 'salvaging' : 'manufacturing', 15);
    }
    m.progress = 0;
  }
