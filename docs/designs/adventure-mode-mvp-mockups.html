    btn.onclick = () => {
      state.surface = btn.dataset.surface;
      state.selectedInvSlot = null;
      if (state.surface === 'machine-auto' || state.surface === 'machine-recipe') {
        state.tabOverlayPane = 'machine';
      } else if (state.surface === 'tab-inv' && state.tabOverlayPane === 'machine') {
        state.tabOverlayPane = 0;
      }
      renderAll();
    };
  });

  window.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key >= '1' && e.key <= '9') {
      state.activeSlot = Number(e.key) - 1;
      if (state.surface === 'hud') renderAll();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      if (state.surface === 'tab-inv' || state.surface === 'machine-auto' || state.surface === 'machine-recipe') {
        state.surface = 'hud';
      } else {
        state.surface = 'tab-inv';
        if (state.tabOverlayPane === 'machine') state.tabOverlayPane = 0;
      }
      renderAll();
    } else if (e.key === 'z' || e.key === 'Z') {
      state.dampeners = !state.dampeners;
      if (state.surface === 'hud') renderAll();
    } else if (e.key === 'Escape' && state.surface !== 'hud') {
      state.surface = 'hud';
      renderAll();
    }
  });

  /* =========================================================================
     LIVE TIMERS
     ========================================================================= */
  setInterval(() => {
    if (state.isMining && state.surface === 'hud') {
      state.miningProgress += 7;
      if (state.miningProgress >= 100) {
        state.miningProgress = 0;
        const isSalvage = state.activeSlot === 1;
        addItem(isSalvage ? 'iron_ingot' : 'iron_ore', isSalvage ? 1 : 2);
        grantSkillXp(isSalvage ? 'salvaging' : 'mining', 24);
      }
      renderAll();
    }
  }, 60);

  setInterval(() => {
    let dirty = false;
    state.buffs.forEach(b => { if (b.secs > 0) b.secs -= 1; });
    state.buffs = state.buffs.filter(b => b.secs > 0);
    if (state.surface === 'hud' || (state.surface === 'tab-inv' && state.tabOverlayPane === 1)) dirty = true;

    if (state.machinePowered && state.surface === 'machine-auto') {
      const m = AUTO_MACHINES[state.activeAutoMachine];
      const hasInput = m.dualRule ? (m.input[0] && m.input[1]) : Boolean(m.input[0]);
      if (hasInput) {
        m.progress += 12;
        if (m.progress >= 100) runAutoProcessCycle(state.activeAutoMachine);
        dirty = true;
      }
    }

    if (state.autoDrainO2 && state.mode === 'adventure' && state.inVacuum && state.surface === 'hud') {
      if (state.o2 > 0) state.o2 -= 1;
      else if (state.hp > 0) {
        state.hp -= 1;
        if (state.hp === 0) { state.deathCause = 'suffocation'; state.autoDrainO2 = false; state.surface = 'death'; }
      }
      dirty = true;
    }

    if (dirty) renderAll();
  }, 1000);

  /* =========================================================================
     SPACE / ASTEROID / LIFEBOAT BACKDROP CANVAS
     ========================================================================= */
  const canvas = document.getElementById('space-canvas');
  const ctx = canvas.getContext('2d');
  const stars = Array.from({ length: 170 }, (_, i) => ({
    x: Math.abs((Math.sin(i * 12.9898) * 43758.5453) % 1),
    y: Math.abs((Math.sin(i * 78.233) * 19341.123) % 1),
    r: (i % 7 === 0) ? 1.8 : 1,
    c: i % 19 === 0 ? '#a5f3fc' : i % 23 === 0 ? '#ffd27d' : i % 29 === 0 ? '#ff8da6' : '#f0f3f6',
    a: 0.25 + (i % 5) * 0.16
  }));

  function drawScene(t) {
    const rect = canvas.parentElement.getBoundingClientRect();
    if (canvas.width !== Math.floor(rect.width) || canvas.height !== Math.floor(rect.height)) {
      canvas.width = Math.floor(rect.width);
      canvas.height = Math.floor(rect.height);
    }
    const w = canvas.width, h = canvas.height;

    const g = ctx.createRadialGradient(w * 0.65, h * 0.35, 20, w * 0.5, h * 0.5, w * 0.78);
    g.addColorStop(0, '#131d31');
    g.addColorStop(0.45, '#0b101b');
    g.addColorStop(1, '#05070d');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    for (const s of stars) {
      const twinkle = 0.75 + 0.25 * Math.sin(t * 0.0015 + s.x * 40);
      ctx.globalAlpha = s.a * twinkle;
      ctx.fillStyle = s.c;
      ctx.fillRect(Math.floor(s.x * w), Math.floor(s.y * h), s.r, s.r);
    }
    ctx.globalAlpha = 1;

    const drawVoxel = (vx, vy, size, top, left, right) => {
      ctx.fillStyle = top;
      ctx.beginPath();
      ctx.moveTo(vx, vy - size * 0.5); ctx.lineTo(vx + size, vy); ctx.lineTo(vx, vy + size * 0.5); ctx.lineTo(vx - size, vy);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = left;
      ctx.beginPath();
      ctx.moveTo(vx - size, vy); ctx.lineTo(vx, vy + size * 0.5); ctx.lineTo(vx, vy + size * 1.45); ctx.lineTo(vx - size, vy + size * 0.95);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = right;
      ctx.beginPath();
      ctx.moveTo(vx + size, vy); ctx.lineTo(vx, vy + size * 0.5); ctx.lineTo(vx, vy + size * 1.45); ctx.lineTo(vx + size, vy + size * 0.95);
      ctx.closePath(); ctx.fill();
    };

    const bob = Math.sin(t * 0.0008) * 3;
    const cx = w * 0.54, cy = h * 0.48;
    [
      [-60, -25, 32, '#5a6988', '#3a4466', '#262b44'],
      [-28, -42, 32, '#8b9bb4', '#5a6988', '#3a4466'],
      [4,   -26, 32, '#2ce8f5', '#0099db', '#124e89'],
      [-28,  -8, 32, '#c28569', '#733e39', '#3e2731'],
      [4,     8, 32, '#5a6988', '#3a4466', '#262b44'],
      [36,  -10, 32, '#5a6988', '#3a4466', '#262b44'],
      [-60,  10, 32, '#3a4466', '#262b44', '#181425']
    ].forEach(([ox, oy, sz, c1, c2, c3]) => drawVoxel(cx + ox, cy + oy + bob, sz, c1, c2, c3));

    const lx = w * 0.22, ly = h * 0.46 - bob * 0.7;
    drawVoxel(lx, ly, 26, '#8b9bb4', '#5a6988', '#3a4466');
    drawVoxel(lx + 26, ly + 13, 26, '#feae34', '#d77643', '#733e39');
    drawVoxel(lx - 26, ly + 13, 26, '#0099db', '#124e89', '#162838');
    drawVoxel(lx, ly + 26, 26, '#5a6988', '#3a4466', '#262b44');

    if (state.isMining && state.surface === 'hud') {
      ctx.save();
      ctx.strokeStyle = state.activeSlot === 1 ? '#4be3e3' : '#f2994a';
      ctx.lineWidth = 4;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.moveTo(w * 0.78, h * 0.92); ctx.lineTo(w * 0.5, h * 0.5); ctx.stroke();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();
      for (let i = 0; i < 6; i++) {
        const ang = (t * 0.02 + i * 1.1);
        const dist = 6 + (t * 0.06 + i * 7) % 18;
        ctx.fillStyle = i % 2 === 0 ? '#fee761' : '#a5f3fc';
        ctx.fillRect(w * 0.5 + Math.cos(ang) * dist, h * 0.5 + Math.sin(ang) * dist, 3, 3);
      }
      ctx.restore();
    }

    requestAnimationFrame(drawScene);
  }

  renderAll();
  requestAnimationFrame(drawScene);
})();
</script>
</body>
</html>
